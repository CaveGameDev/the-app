<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Loader</title>
    <style>
        :root {
            --bg: #5a5c5e; --panel: #4c4e50; --panel-edge: #3d3f41;
            --text: #f2f2f0; --text-dim: #c7c8c6; --warn: #ffd27a; --error: #ff8a80;
            --orange-1: #ffb648; --orange-2: #ff8a1e; --orange-3: #e0680a;
            --track: #33343580;
            --mono: ui-monospace, "Cascadia Mono", "SFMono-Regular", "Consolas", "Courier New", monospace;
            --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            background: radial-gradient(ellipse at 50% 20%, #66686a 0%, var(--bg) 55%, #4e5052 100%);
            color: var(--text); font-family: var(--sans);
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        #shell {
            width: min(560px, 90vw); display: flex; flex-direction: column; align-items: center;
            transition: opacity 600ms ease, transform 600ms ease;
        }
        #shell.hidden { opacity: 0; transform: scale(0.98); pointer-events: none; }
        #art-frame {
            width: 100%; border-radius: 8px; overflow: hidden; background: #333436;
            border: 1px solid var(--panel-edge);
            box-shadow: 0 20px 50px -18px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
            margin-bottom: 22px;
        }
        #art-frame img { width: 100%; height: auto; display: block; }
        #bar-label {
            display: flex; justify-content: space-between; width: 100%; font-size: 13px;
            color: var(--text-dim); margin-bottom: 8px; letter-spacing: 0.02em;
        }
        #bar-label #status-text { color: var(--text); font-weight: 600; }
        #bar-track {
            width: 100%; height: 22px; border-radius: 11px; background: var(--track);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.45), inset 0 -1px 0 rgba(255, 255, 255, 0.03);
            overflow: hidden; position: relative; border: 1px solid rgba(0, 0, 0, 0.35);
        }
        #bar-fill {
            height: 100%; width: 0%; border-radius: 11px;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0.08) 12%, transparent 45%),
                linear-gradient(180deg, var(--orange-1) 0%, var(--orange-2) 55%, var(--orange-3) 100%);
            box-shadow: 0 0 12px 0 rgba(255, 138, 30, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.5), inset 0 -2px 3px rgba(150, 60, 0, 0.4);
            position: relative; transition: width 220ms ease-out;
        }
        #bar-fill::after {
            content: ""; position: absolute; inset: 0;
            background: linear-gradient(110deg, transparent 20%, rgba(255, 255, 255, 0.35) 35%, rgba(255, 255, 255, 0.05) 50%, transparent 65%);
            background-size: 220% 100%; animation: sheen 2.6s linear infinite;
        }
        @keyframes sheen { 0% { background-position: 120% 0; } 100% { background-position: -40% 0; } }
        @media (prefers-reduced-motion: reduce) { #bar-fill::after { animation: none; } }
        #meta-row {
            display: flex; justify-content: space-between; width: 100%; margin-top: 10px;
            font-size: 12px; color: var(--text-dim); font-family: var(--mono);
        }
        #meta-row b { color: var(--text); font-weight: 600; }
        #meta-row .warn { color: var(--warn); }
        #meta-row .err { color: var(--error); }
    </style>
</head>
<body>
    <div id="shell">
        <div id="art-frame"><img src="img.png" alt="Loading" /></div>
        <div id="bar-label">
            <span id="status-text">Loading&hellip;</span>
            <span id="pct-text">0%</span>
        </div>
        <div id="bar-track"><div id="bar-fill"></div></div>
        <div id="meta-row">
            <span id="stat-parts">0 / 75 parts</span>
            <span id="stat-bytes">0 MB</span>
            <span id="stat-eta">estimating time remaining&hellip;</span>
        </div>
    </div>

    <script src="https://unpkg.com/fflate@0.8.2/umd/index.js"></script>
    <script>
        const CONFIG = {
            totalParts: 75,
            partPath: (i) => `HL2_Web.zip.part${String(i).padStart(2, '0')}`,
            // MUST match CACHE_NAME in sw.js
            cacheName: "cl2",
            // Files are cached at paths relative to the SW scope root — no
            // prefix — because sw.js matches requests against the scope root
            // directly (e.g. 'chunks/d1_canals_01.data', not 'app/chunks/...').
            appDir: "",
            // Bump this whenever the zip contents change to invalidate old caches.
            zipVersion: "v1"
        };

        // Written into the cache once extraction fully succeeds; checked on
        // every load so we skip the 1.6GB download+extract entirely when the
        // cache is already populated and current.
        const MANIFEST_URL = new URL("__hl2_cache_manifest__", location.href).href;

        const els = {
            shell: document.getElementById("shell"),
            status: document.getElementById("status-text"),
            pct: document.getElementById("pct-text"),
            fill: document.getElementById("bar-fill"),
            parts: document.getElementById("stat-parts"),
            bytes: document.getElementById("stat-bytes"),
            eta: document.getElementById("stat-eta"),
        };

        function fmtMB(bytes) {
            return (bytes / (1024 * 1024)).toFixed(1) + " MB";
        }

        function fmtETA(seconds) {
            if (!isFinite(seconds) || seconds < 0) return "estimating time remaining\u2026";
            if (seconds < 1) return "almost done\u2026";
            const m = Math.floor(seconds / 60);
            const s = Math.round(seconds % 60);
            return m > 0 ? `~${m}m ${s}s remaining` : `~${s}s remaining`;
        }

        async function readManifest(cache) {
            const resp = await cache.match(MANIFEST_URL);
            if (!resp) return null;
            try {
                return await resp.json();
            } catch {
                return null;
            }
        }

        async function writeManifest(cache) {
            const manifest = {
                zipVersion: CONFIG.zipVersion,
                totalParts: CONFIG.totalParts,
                completedAt: new Date().toISOString(),
            };
            await cache.put(MANIFEST_URL, new Response(JSON.stringify(manifest), {
                headers: { "Content-Type": "application/json" }
            }));
        }

        function manifestIsCurrent(manifest) {
            return !!manifest
                && manifest.zipVersion === CONFIG.zipVersion
                && manifest.totalParts === CONFIG.totalParts;
        }

        // Tracks aggregate progress across all parts and drives the UI.
        // Total size is estimated on the fly from Content-Length headers on the
        // real GET requests (no separate HEAD pre-flight — some CDNs, Netlify
        // included, don't reliably serve HEAD for large static assets even
        // though GET works fine).
        const progress = {
            loadedBytes: 0,
            partsDone: 0,
            knownSizeSum: 0,   // sum of Content-Length for parts where it was known
            knownSizeCount: 0, // how many parts contributed to knownSizeSum
            startTime: 0,
        };

        function estimatedTotalBytes() {
            if (progress.knownSizeCount === 0) return 0;
            const avgPartSize = progress.knownSizeSum / progress.knownSizeCount;
            return avgPartSize * CONFIG.totalParts;
        }

        function renderProgress() {
            const totalBytes = estimatedTotalBytes();
            const byBytes = totalBytes > 0;
            const fraction = byBytes
                ? progress.loadedBytes / totalBytes
                : progress.partsDone / CONFIG.totalParts;
            const pct = Math.min(100, Math.max(0, fraction * 100));

            els.fill.style.width = pct.toFixed(1) + "%";
            els.pct.textContent = Math.round(pct) + "%";
            els.parts.textContent = `${progress.partsDone} / ${CONFIG.totalParts} parts`;
            els.bytes.textContent = byBytes
                ? `${fmtMB(progress.loadedBytes)} / ~${fmtMB(totalBytes)}`
                : fmtMB(progress.loadedBytes);

            const elapsed = (performance.now() - progress.startTime) / 1000;
            if (elapsed > 0.5 && fraction > 0.001) {
                const rate = fraction / elapsed; // fraction per second
                const remaining = (1 - fraction) / rate;
                els.eta.textContent = fmtETA(remaining);
            }
        }

        async function main() {
            if (!('serviceWorker' in navigator)) {
                throw new Error("Service workers aren't supported in this browser.");
            }

            // Register the SW up front. It doesn't need the cache populated to
            // install/activate — it only reads the cache lazily per-request —
            // but the page it's asked to control (the iframe below) won't be
            // intercepted until it's active, so we wait for that here.
            els.status.textContent = "Registering service worker\u2026";
            await navigator.serviceWorker.register("sw.js");
            await navigator.serviceWorker.ready;

            // Ask the browser not to silently evict this ~1.6GB cache under
            // storage pressure. Not guaranteed (esp. Safari), but it helps.
            if (navigator.storage && navigator.storage.persist) {
                try { await navigator.storage.persist(); } catch { /* best effort */ }
            }

            const forceReset = new URLSearchParams(location.search).has("reset");
            if (forceReset) {
                els.status.textContent = "Clearing cache\u2026";
                await caches.delete(CONFIG.cacheName);
            }
            const cache = await caches.open(CONFIG.cacheName);

            // --- Skip the whole download+extract if we already have a current,
            // fully-extracted cache from a previous run ---
            if (!forceReset) {
                const manifest = await readManifest(cache);
                if (manifestIsCurrent(manifest)) {
                    els.status.textContent = "Loaded from cache";
                    els.fill.style.width = "100%";
                    els.pct.textContent = "100%";
                    els.parts.textContent = `${CONFIG.totalParts} / ${CONFIG.totalParts} parts`;
                    els.bytes.textContent = "cached";
                    els.eta.textContent = "done";

                    // Top-level navigation (not an iframe) — SharedArrayBuffer
                    // requires the document itself to be crossOriginIsolated,
                    // which needs COOP/COEP on the actual top-level response.
                    location.href = CONFIG.appDir + "index.html";
                    return;
                }
            }

            // --- Set up the streaming unzipper (correct fflate streaming API) ---
            const unzipper = new fflate.Unzip();
            unzipper.register(fflate.UnzipInflate);

            const pendingWrites = [];

            unzipper.onfile = (file) => {
                const chunks = [];
                file.ondata = (err, chunk, final) => {
                    if (err) {
                        console.error("Unzip error on", file.name, err);
                        return;
                    }
                    if (chunk && chunk.length) chunks.push(chunk);
                    if (final) {
                        const total = chunks.reduce((n, c) => n + c.length, 0);
                        const data = new Uint8Array(total);
                        let pos = 0;
                        for (const c of chunks) { data.set(c, pos); pos += c.length; }

                        const resp = new Response(data, {
                            headers: { "Content-Type": "application/octet-stream" }
                        });
                        const url = new URL(CONFIG.appDir + file.name, location.href).href;
                        pendingWrites.push(cache.put(url, resp));
                    }
                };
                file.start();
            };

            progress.startTime = performance.now();
            els.status.textContent = "Downloading\u2026";

            // --- Stream all parts into the unzipper ---
            for (let i = 1; i <= CONFIG.totalParts; i++) {
                const res = await fetch(CONFIG.partPath(i));
                if (!res.ok) {
                    throw new Error(`Failed to fetch ${CONFIG.partPath(i)}: ${res.status}`);
                }

                const len = res.headers.get("content-length");
                if (len) {
                    progress.knownSizeSum += parseInt(len, 10);
                    progress.knownSizeCount += 1;
                }

                const reader = res.body.getReader();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    unzipper.push(value, false);
                    progress.loadedBytes += value.length;
                    renderProgress();
                }

                progress.partsDone = i;
                renderProgress();
            }

            // Final push signals end-of-stream to fflate
            unzipper.push(new Uint8Array(0), true);

            els.status.textContent = "Finishing up\u2026";
            await Promise.all(pendingWrites);
            await writeManifest(cache);

            // --- Launch ---
            els.status.textContent = "Launching\u2026";
            els.fill.style.width = "100%";
            els.pct.textContent = "100%";
            els.eta.textContent = "done";

            // Top-level navigation (not an iframe) — see note above.
            location.href = CONFIG.appDir + "index.html";
        }

        main().catch((err) => {
            console.error(err);
            els.status.textContent = "Load failed";
            els.status.classList.add("err");
            els.eta.textContent = String(err.message || err);
            els.eta.classList.add("err");
        });
    </script>
</body>
</html>
