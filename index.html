<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Loader</title>
     <style> :root { --bg: #5a5c5e; --panel: #4c4e50; --panel-edge: #3d3f41; --text: #f2f2f0; --text-dim: #c7c8c6; --warn: #ffd27a; --error: #ff8a80; --orange-1: #ffb648; --orange-2: #ff8a1e; --orange-3: #e0680a; --track: #33343580; --mono: ui-monospace, "Cascadia Mono", "SFMono-Regular", "Consolas", "Courier New", monospace; --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; } * { box-sizing: border-box; } html, body { height: 100%; margin: 0; } body { background: radial-gradient(ellipse at 50% 20%, #66686a 0%, var(--bg) 55%, #4e5052 100%); color: var(--text); font-family: var(--sans); display: flex; align-items: center; justify-content: center; overflow: hidden; } #shell { width: min(560px, 90vw); display: flex; flex-direction: column; align-items: center; transition: opacity 600ms ease, transform 600ms ease; } #shell.hidden { opacity: 0; transform: scale(0.98); pointer-events: none; } #art-frame { width: 100%; border-radius: 8px; overflow: hidden; background: #333436; border: 1px solid var(--panel-edge); box-shadow: 0 20px 50px -18px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.04); margin-bottom: 22px; } #art-frame img { width: 100%; height: auto; display: block; } #bar-label { display: flex; justify-content: space-between; width: 100%; font-size: 13px; color: var(--text-dim); margin-bottom: 8px; letter-spacing: 0.02em; } #bar-label #status-text { color: var(--text); font-weight: 600; } #bar-track { width: 100%; height: 22px; border-radius: 11px; background: var(--track); box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.45), inset 0 -1px 0 rgba(255, 255, 255, 0.03); overflow: hidden; position: relative; border: 1px solid rgba(0, 0, 0, 0.35); } #bar-fill { height: 100%; width: 0%; border-radius: 11px; background: linear-gradient( 180deg, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0.08) 12%, transparent 45% ), linear-gradient(180deg, var(--orange-1) 0%, var(--orange-2) 55%, var(--orange-3) 100%); box-shadow: 0 0 12px 0 rgba(255, 138, 30, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.5), inset 0 -2px 3px rgba(150, 60, 0, 0.4); position: relative; transition: width 220ms ease-out; } #bar-fill::after { content: ""; position: absolute; inset: 0; background: linear-gradient( 110deg, transparent 20%, rgba(255, 255, 255, 0.35) 35%, rgba(255, 255, 255, 0.05) 50%, transparent 65% ); background-size: 220% 100%; animation: sheen 2.6s linear infinite; } @keyframes sheen { 0% { background-position: 120% 0; } 100% { background-position: -40% 0; } } @media (prefers-reduced-motion: reduce) { #bar-fill::after { animation: none; } } #meta-row { display: flex; justify-content: space-between; width: 100%; margin-top: 10px; font-size: 12px; color: var(--text-dim); font-family: var(--mono); } #meta-row b { color: var(--text); font-weight: 600; } #meta-row .warn { color: var(--warn); } #meta-row .err { color: var(--error); } #stage { position: fixed; inset: 0; border: 0; width: 100%; height: 100%; display: none; z-index: 10; background: #000; } </style> </head> <body> <div id="shell"> <div id="art-frame"><img src="img.png" alt="Loading" /></div> <div id="bar-label"><span id="status-text">Loading&hellip;</span> <span id="pct-text">0%</span></div> <div id="bar-track"><div id="bar-fill"></div></div> <div id="meta-row"> <span id="stat-parts">0 / 75 parts</span> <span id="stat-bytes">0 MB</span> <span id="stat-eta">estimating time remaining&hellip;</span> </div> </div>
    </head>
<body>
    <div id="shell">
        <div id="status-text">Initializing...</div>
        <div id="bar-track"><div id="bar-fill"></div></div>
    </div>
    <iframe id="stage" style="display:none; width:100%; height:100%; border:none;"></iframe>

    <script src="https://unpkg.com/fflate@0.8.2/umd/index.js"></script>
    <script>
        const CONFIG = {
            totalParts: 75,
            partPath: (i) => `HL2_Web.zip.part${String(i).padStart(2, '0')}`,
            cacheName: "app-assets-v1",
            appDir: "app/"
        };

        async function main() {
            const cache = await caches.open(CONFIG.cacheName);
            const unzipper = new fflate.Unzip();
            
            // Link the stream to cache processing
            unzipper.register(async (file, final) => {
                const data = new Uint8Array(file.originalSize);
                let pos = 0;
                
                for (const chunk of file.chunks) {
                    data.set(chunk, pos);
                    pos += chunk.length;
                }

                const resp = new Response(data, {
                    headers: { "Content-Type": "application/octet-stream" }
                });
                await cache.put(new URL(CONFIG.appDir + file.name, location.href).href, resp);
                if (final) console.log("Unzip Complete");
            });

            // Stream chunks into the unzipper
            for (let i = 1; i <= CONFIG.totalParts; i++) {
                const resp = await fetch(CONFIG.partPath(i));
                const reader = resp.body.getReader();
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    unzipper.push(value); // Push chunks directly to stream
                }
            }
            unzipper.push(new Uint8Array(0), true); // Finalize
            
            // Launch
            document.getElementById("stage").src = CONFIG.appDir + "index.html";
            document.getElementById("stage").style.display = "block";
        }

        main().catch(console.error);
    </script>
</body>
</html>
