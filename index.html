<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Loader</title>
        <style>
            :root {
                --bg: #5a5c5e;
                --panel: #4c4e50;
                --panel-edge: #3d3f41;
                --text: #f2f2f0;
                --text-dim: #c7c8c6;
                --warn: #ffd27a;
                --error: #ff8a80;
                --orange-1: #ffb648;
                --orange-2: #ff8a1e;
                --orange-3: #e0680a;
                --track: #33343580;
                --mono: ui-monospace, "Cascadia Mono", "SFMono-Regular", "Consolas", "Courier New", monospace;
                --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                height: 100%;
                margin: 0;
            }
            body {
                background: radial-gradient(ellipse at 50% 20%, #66686a 0%, var(--bg) 55%, #4e5052 100%);
                color: var(--text);
                font-family: var(--sans);
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }
            #shell {
                width: min(560px, 90vw);
                display: flex;
                flex-direction: column;
                align-items: center;
                transition:
                    opacity 600ms ease,
                    transform 600ms ease;
            }
            #shell.hidden {
                opacity: 0;
                transform: scale(0.98);
                pointer-events: none;
            }
            #art-frame {
                width: 100%;
                border-radius: 8px;
                overflow: hidden;
                background: #333436;
                border: 1px solid var(--panel-edge);
                box-shadow:
                    0 20px 50px -18px rgba(0, 0, 0, 0.55),
                    inset 0 0 0 1px rgba(255, 255, 255, 0.04);
                margin-bottom: 22px;
            }
            #art-frame img {
                width: 100%;
                height: auto;
                display: block;
            }
            #bar-label {
                display: flex;
                justify-content: space-between;
                width: 100%;
                font-size: 13px;
                color: var(--text-dim);
                margin-bottom: 8px;
                letter-spacing: 0.02em;
            }
            #bar-label #status-text {
                color: var(--text);
                font-weight: 600;
            }
            #bar-track {
                width: 100%;
                height: 22px;
                border-radius: 11px;
                background: var(--track);
                box-shadow:
                    inset 0 2px 4px rgba(0, 0, 0, 0.45),
                    inset 0 -1px 0 rgba(255, 255, 255, 0.03);
                overflow: hidden;
                position: relative;
                border: 1px solid rgba(0, 0, 0, 0.35);
            }
            #bar-fill {
                height: 100%;
                width: 0%;
                border-radius: 11px;
                background: linear-gradient(
                        180deg,
                        rgba(255, 255, 255, 0.55) 0%,
                        rgba(255, 255, 255, 0.08) 12%,
                        transparent 45%
                    ),
                    linear-gradient(180deg, var(--orange-1) 0%, var(--orange-2) 55%, var(--orange-3) 100%);
                box-shadow:
                    0 0 12px 0 rgba(255, 138, 30, 0.55),
                    inset 0 1px 0 rgba(255, 255, 255, 0.5),
                    inset 0 -2px 3px rgba(150, 60, 0, 0.4);
                position: relative;
                transition: width 220ms ease-out;
            }
            #bar-fill::after {
                content: "";
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    110deg,
                    transparent 20%,
                    rgba(255, 255, 255, 0.35) 35%,
                    rgba(255, 255, 255, 0.05) 50%,
                    transparent 65%
                );
                background-size: 220% 100%;
                animation: sheen 2.6s linear infinite;
            }
            @keyframes sheen {
                0% {
                    background-position: 120% 0;
                }
                100% {
                    background-position: -40% 0;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                #bar-fill::after {
                    animation: none;
                }
            }
            #meta-row {
                display: flex;
                justify-content: space-between;
                width: 100%;
                margin-top: 10px;
                font-size: 12px;
                color: var(--text-dim);
                font-family: var(--mono);
            }
            #meta-row b {
                color: var(--text);
                font-weight: 600;
            }
            #meta-row .warn {
                color: var(--warn);
            }
            #meta-row .err {
                color: var(--error);
            }
            #stage {
                position: fixed;
                inset: 0;
                border: 0;
                width: 100%;
                height: 100%;
                display: none;
                z-index: 10;
                background: #000;
            }
        </style>
    </head>
    <body>
        <div id="shell">
            <div id="art-frame"><img src="img.png" alt="Loading" /></div>
            <div id="bar-label"><span id="status-text">Loading&hellip;</span> <span id="pct-text">0%</span></div>
            <div id="bar-track"><div id="bar-fill"></div></div>
            <div id="meta-row">
                <span id="stat-parts">0 / 75 parts</span> <span id="stat-bytes">0 MB</span>
                <span id="stat-eta">estimating time remaining&hellip;</span>
            </div>
        </div>
        <iframe id="stage" title="Application" allow="autoplay; fullscreen; gamepad; cross-origin-isolated"></iframe>
        <script src="fflate.js"></script>
        <script>
            (function () {
                "use strict";
                const CONFIG = {
                    totalParts: 75,
                    partPath: (i) => `HL2_Web.zip.part${String(i).padStart(2, '0')}`,
                    manifestPath: "manifest.json",
                    appDir: "app/",
                    appEntry: "app/index.html",
                    cacheName: "app-assets-v1",
                    swPath: "sw.js",
                    maxRetries: 3,
                };
                const $ = (id) => document.getElementById(id);
                const statusText = $("status-text");
                const pctText = $("pct-text");
                const barFill = $("bar-fill");
                const statParts = $("stat-parts");
                const statBytes = $("stat-bytes");
                const statEta = $("stat-eta");
                const shellEl = $("shell");
                const stageEl = $("stage");
                function setStatus(text) {
                    statusText.textContent = text;
                }
                function setPct(p) {
                    p = Math.max(0, Math.min(100, p));
                    barFill.style.width = p + "%";
                    pctText.textContent = Math.round(p) + "%";
                }
                function setEta(seconds) {
                    if (seconds == null || !isFinite(seconds) || seconds < 0) {
                        statEta.textContent = "estimating time remaining\u2026";
                        statEta.className = "";
                        return;
                    }
                    if (seconds < 1) {
                        statEta.textContent = "almost done";
                        statEta.className = "";
                        return;
                    }
                    const m = Math.floor(seconds / 60);
                    const s = Math.round(seconds % 60);
                    statEta.textContent = m > 0 ? `${m}m ${s}s remaining` : `${s}s remaining`;
                    statEta.className = "";
                }
                function fmtBytes(n) {
                    if (n < 1024) return n + " B";
                    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
                    if (n < 1024 * 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + " MB";
                    return (n / (1024 * 1024 * 1024)).toFixed(2) + " GB";
                }
                function mimeFor(path) {
                    const ext = path.split(".").pop().toLowerCase();
                    const map = {
                        html: "text/html; charset=utf-8",
                        js: "application/javascript; charset=utf-8",
                        mjs: "application/javascript; charset=utf-8",
                        json: "application/json; charset=utf-8",
                        wasm: "application/wasm",
                        data: "application/octet-stream",
                        css: "text/css; charset=utf-8",
                        png: "image/png",
                        jpg: "image/jpeg",
                        jpeg: "image/jpeg",
                        gif: "image/gif",
                        svg: "image/svg+xml",
                        webp: "image/webp",
                        ico: "image/x-icon",
                        mp3: "audio/mpeg",
                        ogg: "audio/ogg",
                        wav: "audio/wav",
                        mp4: "video/mp4",
                        webm: "video/webm",
                        woff: "font/woff",
                        woff2: "font/woff2",
                        ttf: "font/ttf",
                        bin: "application/octet-stream",
                    };
                    return map[ext] || "application/octet-stream";
                }
                async function main() {
                    try {
                        setStatus("Preparing\u2026");
                        if (!("serviceWorker" in navigator)) {
                            throw new Error("This browser does not support Service Workers.");
                        }
                        const reg = await navigator.serviceWorker.register(CONFIG.swPath);
                        await navigator.serviceWorker.ready;
                        const cache = await caches.open(CONFIG.cacheName);
                        const sentinelUrl = new URL(CONFIG.appDir + ".installed", location.href).href;
                        const sentinel = await cache.match(sentinelUrl);
                        if (sentinel) {
                            setStatus("Resuming\u2026");
                            setPct(100);
                            setEta(0);
                            return launch();
                        }
                        let parts = [];
                        let totalBytes = 0;
                        try {
                            const manifestResp = await fetch(CONFIG.manifestPath, { cache: "no-store" });
                            if (manifestResp.ok) {
                                const manifest = await manifestResp.json();
                                parts = manifest.parts.map((p) => p.path);
                                totalBytes = manifest.totalBytes || 0;
                            }
                        } catch (e) {}
                        if (parts.length === 0) {
                            for (let i = 1; i <= CONFIG.totalParts; i++) parts.push(CONFIG.partPath(i));
                        }
                        statParts.textContent = `0 / ${parts.length} parts`;
                        setStatus("Loading\u2026");
                        const buffers = new Array(parts.length);
                        let bytesSoFar = 0;
                        const startTime = performance.now();
                        for (let i = 0; i < parts.length; i++) {
                            const url = parts[i];
                            let attempt = 0;
                            let lastErr = null;
                            while (attempt < CONFIG.maxRetries) {
                                attempt++;
                                try {
                                    const resp = await fetch(url, { cache: "no-store" });
                                    if (!resp.ok) throw new Error(`HTTP ${resp.status} for ${url}`);
                                    const reader = resp.body.getReader();
                                    const chunks = [];
                                    let partLen = 0;
                                    while (true) {
                                        const { done, value } = await reader.read();
                                        if (done) break;
                                        chunks.push(value);
                                        partLen += value.byteLength;
                                        bytesSoFar += value.byteLength;
                                        const elapsed = (performance.now() - startTime) / 1000;
                                        const rate = elapsed > 0.3 ? bytesSoFar / elapsed : 0;
                                        statBytes.textContent =
                                            fmtBytes(bytesSoFar) + (totalBytes ? " / " + fmtBytes(totalBytes) : "");
                                        if (totalBytes && rate > 0) {
                                            setPct((bytesSoFar / totalBytes) * 90);
                                            setEta((totalBytes - bytesSoFar) / rate);
                                        }
                                    }
                                    const merged = new Uint8Array(partLen);
                                    let off = 0;
                                    for (const c of chunks) {
                                        merged.set(c, off);
                                        off += c.byteLength;
                                    }
                                    buffers[i] = merged;
                                    lastErr = null;
                                    break;
                                } catch (err) {
                                    lastErr = err;
                                    statEta.textContent = `retrying part ${i + 1} (attempt ${attempt})`;
                                    statEta.className = "warn";
                                    await new Promise((r) => setTimeout(r, 400 * attempt));
                                }
                            }
                            if (lastErr) {
                                throw new Error(
                                    `Failed to fetch part ${i + 1}/${parts.length} after ${CONFIG.maxRetries} attempts: ${lastErr.message}`
                                );
                            }
                            statParts.textContent = `${i + 1} / ${parts.length} parts`;
                            if (!totalBytes) setPct(((i + 1) / parts.length) * 90);
                        }
                        setStatus("Reassembling\u2026");
                        const totalLen = buffers.reduce((a, b) => a + b.byteLength, 0);
                        const zipBytes = new Uint8Array(totalLen);
                        let offset = 0;
                        for (const b of buffers) {
                            zipBytes.set(b, offset);
                            offset += b.byteLength;
                        }
                        buffers.length = 0;
                        setStatus("Unpacking\u2026");
                        setEta(null);
                        const files = await new Promise((resolve, reject) => {
                            fflate.unzip(zipBytes, (err, data) => {
                                if (err) reject(err);
                                else resolve(data);
                            });
                        });
                        const fileNames = Object.keys(files);
                        setPct(95);
                        setStatus("Caching\u2026");
                        let written = 0;
                        for (const name of fileNames) {
                            const bytes = files[name];
                            if (name.endsWith("/")) continue;
                            const cacheUrl = new URL(CONFIG.appDir + name, location.href).href;
                            const resp = new Response(bytes, {
                                headers: { "Content-Type": mimeFor(name), "Content-Length": String(bytes.byteLength) },
                            });
                            await cache.put(cacheUrl, resp);
                            written++;
                            if (written % 25 === 0 || written === fileNames.length) {
                                setPct(95 + (written / fileNames.length) * 4);
                            }
                        }
                        await cache.put(
                            sentinelUrl,
                            new Response(JSON.stringify({ installedAt: Date.now() }), {
                                headers: { "Content-Type": "application/json" },
                            })
                        );
                        setPct(100);
                        setEta(0);
                        setStatus("Launching\u2026");
                        launch();
                    } catch (err) {
                        console.error(err);
                        setStatus("Something went wrong");
                        statEta.textContent = err.message;
                        statEta.className = "err";
                    }
                }
                function launch() {
                    setTimeout(() => {
                        stageEl.src = CONFIG.appEntry;
                        stageEl.style.display = "block";
                        shellEl.classList.add("hidden");
                    }, 400);
                }
                main();
            })();
        </script>
    </body>
</html>
